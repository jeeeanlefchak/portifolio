<section id="certificacoes" class="certifications">
  <div class="container">
    <h2 class="section-title">Certificações</h2>
    <p class="section-subtitle">Qualificações profissionais que demonstram minha expertise</p>

    <div class="certifications-grid">
      <div *ngFor="let cert of certifications; let i = index" class="cert-card" [style.animation-delay]="(i * 0.1) + 's'">
        <div class="cert-badge">
          <span class="cert-icon">🏆</span>
        </div>
        <h3>{{ cert.title }}</h3>
        <p class="issuer">{{ cert.issuer }}</p>
        <p class="date" *ngIf="cert.date">{{ cert.date }}</p>
      </div>
    </div>
  </div>
</section>
