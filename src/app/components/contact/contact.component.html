<section id="contato" class="contact">
  <div class="container">
    <h2 class="section-title">Entre em Contato</h2>
    <p class="section-subtitle">Vamos conversar sobre suas ideias e projetos</p>

    <div class="contact-content">
      <div class="contact-info-card">
        <h3>Informações de Contato</h3>
        <div class="info-item">
          <span class="label">📧 Email</span>
          <a href="mailto:{{ profile.email }}" class="value">{{ profile.email }}</a>
        </div>
        <div class="info-item">
          <span class="label">📱 Telefone/WhatsApp</span>
          <a [href]="getWhatsAppLink()" target="_blank" class="value">{{ profile.phone }}</a>
        </div>
        <div class="info-item">
          <span class="label">📍 Localização</span>
          <span class="value">{{ profile.location }}</span>
        </div>
        <div class="social-links">
          <a href="{{ profile.linkedin }}" target="_blank" class="social-link">LinkedIn</a>
        </div>
      </div>

      <form class="contact-form" (ngSubmit)="submitForm()">
        <div class="form-group">
          <label for="name">Nome</label>
          <input
            type="text"
            id="name"
            [(ngModel)]="form.name"
            name="name"
            required
            placeholder="Seu nome"
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            [(ngModel)]="form.email"
            name="email"
            required
            placeholder="seu@email.com"
          />
        </div>

        <div class="form-group">
          <label for="message">Mensagem</label>
          <textarea
            id="message"
            [(ngModel)]="form.message"
            name="message"
            required
            rows="5"
            placeholder="Sua mensagem aqui..."
          ></textarea>
        </div>

        <button type="submit" class="submit-btn">Enviar Mensagem</button>

        <div *ngIf="submitted" class="success-message">
          ✓ Mensagem enviada com sucesso! Vou responder em breve.
        </div>
      </form>
    </div>
  </div>
</section>
